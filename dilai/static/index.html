<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langu-AI</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fbfaf7; --card:#ffffff; --ink:#22252b; --muted:#6d717a; --line:#e3dfd6;
  --accent:#2f6f5e; --accent-soft:#e2efea; --me:#e9eef6; --warn:#a2541b; --warn-soft:#fbefe2;
  --ok:#2f7d4f; --bad:#b3402f; --mark:#b98a2c;
  --A1:#7a9a3a; --A2:#4f9a6b; --B1:#3a8f9a; --B2:#3f6fb0; --C1:#6a58b5; --C2:#9a4f9a;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#17191c; --panel:#1c1f23; --card:#23272c; --ink:#e6e4df; --muted:#9a9ea6; --line:#31363d;
  --accent:#6fbfa8; --accent-soft:#213a34; --me:#27303c; --warn:#e0a26b; --warn-soft:#3a2c1f;
  --ok:#6cc08b; --bad:#e58374; --mark:#d6ac55;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){button.primary{color:#10201b}}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header .sp{flex:1}
header select{max-width:300px}
main{flex:1;display:flex;min-height:0}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:26px 28px 12px}
.row{display:flex;gap:14px;margin:0 auto 16px;max-width:900px;align-items:flex-start}
.row.user{justify-content:flex-end}
.bubble{max-width:620px;padding:11px 15px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.row.ai .bubble{background:var(--card);border:1px solid var(--line);font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:16.5px;line-height:1.6}
.row.user .bubble{background:var(--me)}
.notes{display:flex;flex-direction:column;gap:6px;max-width:300px;flex:0 1 300px;margin-top:2px}
.note{font-size:12.5px;line-height:1.4;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:6px;padding:6px 9px;cursor:pointer}
.note.minor{border-left-color:var(--mark)}
.note s{color:var(--muted)}
.note b{font-weight:600}
.note .why{display:none;color:var(--muted);margin-top:3px}
.note.open .why{display:block}
.note .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--warn);margin-right:6px}
.w{border-bottom:1.5px dotted var(--mark);cursor:pointer}
.w:hover{background:var(--accent-soft)}
.typing{color:var(--muted);font-size:13px;max-width:900px;margin:0 auto 12px;min-height:20px}
.err{max-width:900px;margin:0 auto 12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px}
#composer{border-top:1px solid var(--line);padding:12px 28px 16px;background:var(--panel)}
#composer .in{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#composer textarea{flex:1;resize:none;min-height:44px;max-height:180px;padding:10px 12px}
#composer button.live{background:var(--bad);border-color:var(--bad);color:#fff}
#composer button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#vstat{max-width:900px;margin:0 auto 6px;font-size:12.5px;color:var(--muted);min-height:18px}
.row.ai{flex-wrap:wrap}
.say{font-size:11.5px;color:var(--muted);cursor:pointer;align-self:flex-end;user-select:none}
.say:hover{color:var(--accent)}
.empty{max-width:560px;margin:8vh auto 0;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-weight:600;margin-bottom:6px}
aside{width:390px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;flex:none}
.tabs button{white-space:nowrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 7px;color:var(--muted);font-size:13.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:0 6px;margin-left:4px}
#pane{flex:1;overflow-y:auto;padding:14px}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 2px 8px;font-weight:600}
h3:first-child{margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card .top{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer}
.card .word{font-weight:600}
.card .sense{font-size:11px;color:var(--muted);letter-spacing:.4px}
.card .pos{font-size:12px;color:var(--muted);font-style:italic}
.card .sp{flex:1}
.lvl{font-size:10.5px;font-weight:700;color:#fff;border-radius:5px;padding:1px 5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.ai{background:var(--mark)}
.card .body{display:none;padding:0 11px 10px;font-size:13.5px}
.card.open .body{display:block}
.card .def{margin-bottom:6px}
.card .ex{color:var(--muted);font-style:italic;margin:2px 0;padding-left:9px;border-left:2px solid var(--line)}
.card .meta{font-size:12px;color:var(--muted);margin-top:6px}
.card .meta b{color:var(--ink);font-weight:600}
.card .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.card .acts button{font-size:12px;padding:3px 9px}
.stage{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.stage i{width:9px;height:5px;border-radius:2px;background:var(--line)}
.stage i.f{background:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 10px}
.fld{margin-bottom:15px}
.fld label.t{display:block;font-weight:600;font-size:13px;margin-bottom:2px}
.fld .d{font-size:12px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:2px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{float:right;font-weight:600;font-size:13px}
.stat{display:grid;grid-template-columns:34px 1fr 78px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.filters input{flex:1;min-width:120px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(640px,92vw);max-height:92vh;overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 4px;font-size:18px}
dialog textarea{width:100%;min-height:74px;margin-top:6px}
.sugg{font-size:12.5px;color:var(--accent);cursor:pointer;margin:4px 10px 0 0;display:inline-block}
.gp{font-size:13px}
.gp .area{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
dialog label.t{display:block;font-weight:600;font-size:13px;margin-top:12px}
dialog .d{font-size:12px;color:var(--muted)}
dialog input[type=text]{width:100%;margin-top:6px}
dialog textarea.sm{min-height:46px}
.recent{font-size:12.5px;margin-top:12px;color:var(--muted)}
.snote{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:6px 9px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.snote span{flex:1}
.snote.mine{border-left:3px solid var(--accent)}
.snote button{padding:0 6px;font-size:14px;line-height:1.3}
.setup textarea{width:100%;min-height:52px;resize:vertical;font-size:13.5px}
#words{flex:1;overflow-y:auto;padding:22px 28px;display:none}
body.words main{display:none} body.words #words{display:block}
#words .in{max-width:1080px;margin:0 auto}
#words h2{margin:0 0 4px;font-size:20px}
.wbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.wbar input{flex:1;min-width:160px}
.wt{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wt th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.wt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.wt tr.r{cursor:pointer}
.wt tr.r:hover td{background:var(--accent-soft)}
.wt tr:last-child td{border-bottom:0}
.wt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wt .def{color:var(--muted);font-size:13px}
.wt tr.x td{background:var(--panel);padding:0 10px 10px}
.wt tr.x .card{margin:8px 0 0;max-width:640px}
.pill{font-size:11.5px;border-radius:10px;padding:1px 8px;white-space:nowrap;background:var(--line)}
.pill.due{background:var(--warn-soft);color:var(--warn)} .pill.known{background:var(--accent-soft);color:var(--accent)}
@media (max-width:900px){.wt .hidem{display:none}}
@media (max-width:900px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:46vh}.notes{display:none}}
</style>
</head>
<body>
<header>
  <h1>Langu-AI</h1>
  <select id="sessions" title="Sessions"></select>
  <span class="sp"></span>
  <button id="wordsBtn">My words</button>
  <button class="primary" id="newBtn">New session</button>
</header>
<main>
  <section id="chat">
    <div id="msgs"></div>
    <div id="composer"><div id="vstat"></div><div class="in">
      <textarea id="input" rows="1" placeholder="Write in English…"></textarea>
      <button id="micBtn" title="Dictate your message. Click again to stop.">Speak</button>
      <button id="talkBtn" title="Hands-free: you talk, the reply is read aloud, then it listens again.">Talk mode</button>
      <button class="primary" id="sendBtn">Send</button>
    </div></div>
  </section>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </aside>
</main>
<section id="words"><div class="in" id="wordsIn"></div></section>

<dialog id="dlg">
  <h2>New session</h2>
  <div class="hint">Pick what you feel like. The words to practise are chosen from your settings.</div>
  <div class="chips" id="dlgModes"></div>
  <div id="dlgFields"></div>
  <div id="dlgSugg"></div>
  <div class="recent" id="dlgRecent"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
    <button id="dlgCancel">Cancel</button><button class="primary" id="dlgStart">Start</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOPICS = ['animals','arts and media','body and health','buildings','clothes','communication','crime','describing things','education','food and drink','money','natural world','people: actions','people: appearance','people: personality','politics','relationships','shopping','sport and games','technology','travel','work'];
const MODE_LABEL = {chat:'Chat', roleplay:'Role-play', adventure:'Adventure', debate:'Debate'};
const SUGG = {
  chat:['Something I read this week','Plans I keep postponing','A film or series worth arguing about'],
  roleplay:['Job interview at a small design studio','Returning a faulty laptop to a stubborn shop assistant','Negotiating rent with a landlord'],
  adventure:['A lighthouse keeper finds a message in a bottle','A detective story in 1920s Istanbul','Stranded on a research station in Antarctica'],
  debate:['Remote work is better than office work','Cities should ban private cars','Social media does more harm than good']};
const SETUP = {
  roleplay:[['you','Who you play','Name, who they are, what they want. e.g. Kaan, a tired architect who wants his deposit back'],
            ['partner','Who the AI plays','One or more characters. e.g. Mrs. Doyle, a charming landlady who never admits fault'],
            ['story','Setting and story','Where and when, what has happened so far, where the scene starts'],
            ['tone','Tone and style','e.g. dry humor, tense, slow-burn, lots of dialogue, swearing is fine'],
            ['rules','Rules and wishes','Anything that must or must not happen. e.g. never decide what my character does']],
  adventure:[['you','Your character','Name, who they are, what they are good and bad at'],
             ['partner','Other characters','People the narrator should play: names, relationships to you, secrets'],
             ['story','Setting and story','The world, the premise, where it starts, where you would like it to go'],
             ['tone','Tone and style','e.g. noir, cozy, realistic, fast-paced, long descriptions or short ones'],
             ['rules','Rules and wishes','e.g. no magic, the mystery must be solvable, do not rush the ending']],
  debate:[['you','Your side','What you will argue'],
          ['rules','Rules and wishes','e.g. be tough on me, ask for evidence, keep it short']],
  chat:[['partner','Who you are talking to','Optional. e.g. a friend who loves football, a skeptical colleague'],
        ['rules','Wishes','e.g. ask me about my week, keep it light']]};
const TOPIC_LABEL = {chat:'What to talk about', roleplay:'The scene in one line', adventure:'The story in one line', debate:'The motion'};
const INTENSITY = ['','Barely there','Light','Balanced','Strong','Drill'];

let S = null, cur = null, tab = 'words', open = new Set(), lastChatKey = '', lastPaneKey = '', dlgMode = 'chat';
let browse = {q:'', status:'learning', level:'', items:null}, statsData = null, timer = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, TTS = 'speechSynthesis' in window;
const V = Object.assign({speak:false, voice:'', rate:0.95, pause:2.5, talk:false, rec:null, want:false, spoken:false, key:null, off:0, last:0, msg:''},
  (() => { try{ return JSON.parse(localStorage.getItem('dilai_voice')) || {}; }catch(e){ return {}; } })());
let mw = {items:null, f:'practising', q:'', level:'', kind:'', sort:'seen', dir:-1, open:new Set()};

async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refresh(){
  clearTimeout(timer);
  try{
    S = await api('/api/state' + (cur ? '?session=' + cur : ''));
    if (S.session) cur = S.session.id;
    render();
  }catch(e){ /* server restarting */ }
  timer = setTimeout(refresh, S && S.session && S.session.busy ? 600 : 2500);
}

/* ---------- chat ---------- */
function patterns(items){
  const out = [];
  for (const it of items){
    if (['known','skipped'].includes(it.session_state)) continue;
    for (const f of (it.forms && it.forms.length ? it.forms : [it.word.toLowerCase()])){
      if (/[()\/]/.test(f) || f.length < 2) continue;
      const ws = f.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      let src;
      if (ws.length === 1) src = ws[0];
      else { ws[0] = ws[0].replace(/e$/, '') + "[a-z']{0,4}"; src = ws.join("\\s+(?:[\\w']+\\s+){0,2}?"); }
      out.push({re: new RegExp('(?<![\\w])' + src + '(?![\\w])', 'gi'), id: it.id, len: f.length});
    }
  }
  return out.sort((a, b) => b.len - a.len);
}
function markup(text, pats){
  const spans = [];
  for (const p of pats){
    p.re.lastIndex = 0; let m;
    while ((m = p.re.exec(text))){
      const a = m.index, b = a + m[0].length;
      if (!spans.some(s => a < s.b && b > s.a)) spans.push({a, b, id: p.id});
      if (m[0].length === 0) p.re.lastIndex++;
    }
  }
  spans.sort((x, y) => x.a - y.a);
  let out = '', i = 0;
  for (const s of spans){ out += esc(text.slice(i, s.a)) + '<span class="w" data-id="' + s.id + '">' + esc(text.slice(s.a, s.b)) + '</span>'; i = s.b; }
  return out + esc(text.slice(i));
}
function noteHtml(f){
  return '<div class="note ' + (f.severity === 'minor' ? 'minor' : '') + '" title="Click for the reason">' +
    (f.category && f.category !== 'other' ? '<span class="cat">' + esc(f.category) + '</span>' : '') +
    '<s>' + esc(f.original) + '</s> → <b>' + esc(f.corrected) + '</b><div class="why">' + esc(f.explanation) + '</div></div>';
}
function renderChat(){
  const box = $('#msgs'), ses = S.session;
  if (!ses){
    box.innerHTML = '<div class="empty"><h2>Practise English by using it</h2><p>Start a session: a chat, a role-play, an adventure or a debate. Words worth learning turn up in the conversation; look them up in the panel whenever you like.</p><p><button class="primary" onclick="openDlg()">New session</button></p></div>';
    $('#composer').style.display = 'none'; return;
  }
  const key = JSON.stringify([ses.id, ses.messages.length, ses.messages.reduce((n, m) => n + m.feedback.length, 0), ses.partial, ses.activity, ses.error, ses.loose_feedback.length, ses.items.map(i => i.id + i.session_state).join()]);
  const desktop = ses.source === 'desktop';
  $('#composer').style.display = desktop ? 'none' : '';
  $('#sendBtn').disabled = ses.busy;
  if (key === lastChatKey) return;
  lastChatKey = key;
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const pats = patterns(ses.items);
  let h = '';
  if (desktop){
    h += '<div class="empty" style="margin-top:3vh"><h2>This session runs in Claude Desktop</h2><p>Keep this window beside the chat. Words from the conversation appear on the right; corrections appear below.</p></div>';
    for (const f of ses.loose_feedback) h += '<div class="row user"><div class="notes" style="max-width:520px;flex-basis:520px">' + noteHtml(f).replace('class="note', 'class="note open') + '</div></div>';
  }
  for (const m of ses.messages){
    if (m.role === 'user') h += '<div class="row user"><div class="notes">' + m.feedback.map(noteHtml).join('') + '</div><div class="bubble">' + esc(m.text) + '</div></div>';
    else h += '<div class="row ai"><div class="bubble">' + markup(m.text, pats) + '</div>' + (TTS ? '<span class="say" data-saymsg="' + m.id + '">Listen</span>' : '') + '</div>';
  }
  if (ses.partial) h += '<div class="row ai"><div class="bubble">' + markup(ses.partial, pats) + '</div></div>';
  if (ses.busy && !ses.partial) h += '<div class="typing">' + (ses.activity === 'noting' ? 'reading what you wrote…' : 'thinking…') + '</div>';
  if (ses.error) h += '<div class="err">' + esc(ses.error) + '</div>';
  box.innerHTML = h;
  if (stick) box.scrollTop = box.scrollHeight;
}
$('#msgs').addEventListener('click', e => {
  const w = e.target.closest('.w'); if (w) return showCard(+w.dataset.id);
  const n = e.target.closest('.note'); if (n) n.classList.toggle('open');
  const sm = e.target.closest('[data-saymsg]');
  if (sm){ const m = S.session.messages.find(x => x.id === +sm.dataset.saymsg); if (m){ speechSynthesis.cancel(); sayText(m.text); } }
});
function showCard(id){
  tab = 'words'; open.add(id); lastPaneKey = ''; render();
  const el = document.querySelector('.card[data-id="' + id + '"]');
  if (el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400); }
  api('/api/item', {session:cur, id, action:'lookup'}).catch(() => {});
}
async function send(){
  const t = $('#input').value.trim();
  if (!t || !S.session || S.session.busy) return;
  $('#input').value = ''; autosize();
  const spoken = V.spoken; V.spoken = false; listen(false);
  S.session.busy = true;
  if (TTS) speechSynthesis.cancel();
  try{ await api('/api/send', {session:cur, text:t, spoken}); }catch(e){ alert(e.message); $('#input').value = t; }
  refresh();
}
function autosize(){ const a = $('#input'); a.style.height = 'auto'; a.style.height = Math.min(180, a.scrollHeight) + 'px'; }
$('#input').addEventListener('input', () => { autosize(); if (!$('#input').value.trim()) V.spoken = false; });
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$('#sendBtn').onclick = send;

/* ---------- cards ---------- */
function stageDots(n){ let h = '<span class="stage" title="Practice stage ' + n + ' of 5">'; for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'f' : '') + '"></i>'; return h + '</span>'; }
function cardHtml(it, inSession){
  const st = it.session_state;
  let dot = '<span class="dot" title="Not used yet"></span>';
  if (st === 'used_ok') dot = '<span class="dot ok" title="You used it correctly"></span>';
  else if (st === 'used_wrong') dot = '<span class="dot bad" title="Used, but not quite right"></span>';
  else if (inSession && it.ai_used) dot = '<span class="dot ai" title="It has come up in the conversation"></span>';
  let b = '<div class="def">' + esc(it.definition) + '</div>';
  for (const ex of (it.examples || []).slice(0, 3)) b += '<div class="ex">' + esc(ex) + '</div>';
  const meta = [];
  if (it.grammar) meta.push(esc(it.grammar));
  if (it.usage) meta.push(esc(it.usage));
  if (it.pron) meta.push('/' + esc(it.pron) + '/');
  if (it.topics) meta.push(esc(it.topics));
  if (meta.length) b += '<div class="meta">' + meta.join(' · ') + '</div>';
  if (it.synonyms) b += '<div class="meta"><b>Similar:</b> ' + esc(it.synonyms) + '</div>';
  if (it.tip) b += '<div class="meta"><b>Tip:</b> ' + esc(it.tip) + '</div>';
  if (it.translation) b += '<div class="meta"><b>Translation:</b> ' + esc(it.translation) + '</div>';
  const label = {known:'known', learning:'practising', unknown:"don't know yet", ignored:'ignored', new:'new', assumed_known:'assumed known'}[it.status] || it.status;
  b += '<div class="meta">' + label + ' · used correctly <b>' + (it.used_correctly || 0) + '</b>, incorrectly <b>' + (it.used_incorrectly || 0) + '</b>' + stageDots(it.stage || 0) + '</div>';
  b += '<div class="acts">';
  if (it.status !== 'known') b += '<button data-act="known">I know this</button>';
  if (it.status !== 'unknown' && it.status !== 'known') b += '<button data-act="unknown">Don\'t know it</button>';
  if (it.status === 'known' || it.status === 'ignored') b += '<button data-act="learning">Practise it</button>';
  if (inSession && !['skipped','known'].includes(st)) b += '<button data-act="skip">Not now</button>';
  if (!inSession && cur) b += '<button data-act="target">Add to this session</button>';
  if (TTS) b += '<button data-saytext="' + esc(it.word.replace(/\b(sb|sth|swh)\b/g, m => ({sb:'somebody', sth:'something', swh:'somewhere'}[m])).replace(/[()\/]/g, ' ')) + '">Listen</button>';
  if (inSession && st === 'skipped') b += '<button data-act="target">Bring back</button>';
  b += '</div>';
  return '<div class="card ' + (open.has(it.id) ? 'open' : '') + '" data-id="' + it.id + '"><div class="top">' + dot +
    '<span class="word">' + esc(it.word) + '</span>' + (it.sense ? '<span class="sense">' + esc(it.sense) + '</span>' : '') +
    '<span class="sp"></span><span class="pos">' + esc(it.pos || '') + '</span>' +
    (it.level ? '<span class="lvl" style="background:var(--' + it.level + ')">' + it.level + '</span>' : '') +
    '</div><div class="body">' + b + '</div></div>';
}

const WF = [['practising','Practising'],['due','Due now'],['unknown',"Don't know"],['weak','Got wrong'],['known','Known'],['ignored','Ignored'],['all','All']];
const wmatch = {practising:i => i.status === 'learning' || i.status === 'unknown', due:i => i.due, unknown:i => i.status === 'unknown',
  weak:i => i.used_incorrectly > 0 && i.status !== 'known', known:i => i.status === 'known', ignored:i => i.status === 'ignored', all:() => true};
async function showWords(on){
  document.body.classList.toggle('words', on);
  $('#wordsBtn').textContent = on ? 'Back to chat' : 'My words';
  if (on){ mw.items = (await api('/api/mywords')).items; renderWords(); }
}
$('#wordsBtn').onclick = () => showWords(!document.body.classList.contains('words'));
function ago(ts){
  if (!ts) return '—';
  const d = Math.floor((Date.now() - new Date(ts.replace(' ', 'T'))) / 864e5);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 30 ? d + ' days ago' : ts.slice(0, 10);
}
function dueText(i){
  if (i.status === 'known') return '<span class="pill known">known</span>';
  if (i.status === 'ignored') return '<span class="pill">ignored</span>';
  if (i.due) return '<span class="pill due">' + (i.status === 'unknown' ? "don't know" : 'due') + '</span>';
  const d = Math.ceil((new Date(i.due_at.replace(' ', 'T')) - Date.now()) / 864e5);
  return '<span class="pill">in ' + d + (d === 1 ? ' day' : ' days') + '</span>';
}
function renderWords(){
  if (!mw.items) return;
  const all = mw.items, q = mw.q.trim().toLowerCase();
  let rows = all.filter(wmatch[mw.f]).filter(i => (!mw.level || i.level === mw.level) && (!mw.kind || i.kind === mw.kind) &&
    (!q || i.word.toLowerCase().includes(q) || (i.definition || '').toLowerCase().includes(q) || (i.forms || []).includes(q)));
  const val = {word:i => i.word.toLowerCase(), level:i => i.level || '', stage:i => i.stage, ok:i => i.used_correctly, bad:i => i.used_incorrectly,
    met:i => i.exposures, used:i => i.last_used || '', seen:i => i.last_seen || '', due:i => i.status === 'known' ? '9' : i.status === 'ignored' ? '99' : (i.due ? '0' : i.due_at || '')}[mw.sort];
  rows.sort((a, b) => (val(a) < val(b) ? -1 : val(a) > val(b) ? 1 : 0) * mw.dir);
  const th = (k, l, cls) => '<th data-sort="' + k + '" class="' + (cls || '') + '">' + l + (mw.sort === k ? (mw.dir > 0 ? ' ↑' : ' ↓') : '') + '</th>';
  let h = '<h2>My words</h2><div class="hint" style="margin:0">Every word, phrase and idiom you have met here, each meaning counted separately. Click a row for the full card.</div>';
  h += '<div class="wbar"><div class="chips">' + WF.map(([k, l]) => '<span class="chip ' + (mw.f === k ? 'on' : '') + '" data-wf="' + k + '">' + l + ' ' + all.filter(wmatch[k]).length + '</span>').join('') + '</div></div>';
  h += '<div class="wbar"><input type="text" id="wq" placeholder="Search a word or meaning…" value="' + esc(mw.q) + '"><select id="wl"><option value="">Any level</option>' + S.levels.map(L => '<option' + (mw.level === L ? ' selected' : '') + '>' + L + '</option>').join('') + '</select><select id="wk"><option value="">Any kind</option>' + S.kinds.map(k => '<option' + (mw.kind === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div>';
  if (!rows.length) h += '<div class="hint">' + (all.length ? 'Nothing matches.' : 'No words yet. They appear here as soon as a session proposes them or you use them.') + '</div>';
  else {
    h += '<table class="wt"><thead><tr>' + th('word', 'Word') + th('level', 'Level') + '<th class="hidem">Meaning</th>' + th('stage', 'Progress') + th('ok', 'Right', 'num') + th('bad', 'Wrong', 'num') + th('met', 'Seen', 'num hidem') + th('used', 'Last used', 'hidem') + th('due', 'Next') + '</tr></thead><tbody>';
    for (const i of rows){
      h += '<tr class="r" data-id="' + i.id + '"><td><b>' + esc(i.word) + '</b> <span class="pos">' + esc(i.pos || '') + '</span>' + (i.sense ? '<div class="sense">' + esc(i.sense) + '</div>' : '') + '</td><td>' + (i.level ? '<span class="lvl" style="background:var(--' + i.level + ')">' + i.level + '</span>' : '') + '</td><td class="def hidem">' + esc(i.definition || '') + '</td><td>' + stageDots(i.stage) + '</td><td class="num">' + i.used_correctly + '</td><td class="num">' + i.used_incorrectly + '</td><td class="num hidem">' + i.exposures + '</td><td class="hidem">' + ago(i.last_used) + '</td><td>' + dueText(i) + '</td></tr>';
      if (mw.open.has(i.id)) h += '<tr class="x"><td colspan="9">' + cardHtml(i, false).replace('class="card ', 'class="card open ') + '</td></tr>';
    }
    h += '</tbody></table><div class="hint" style="margin-top:8px">' + rows.length + ' shown. Progress fills as you use a word correctly on separate days; “Seen” counts how often the AI used it in front of you.</div>';
  }
  $('#wordsIn').innerHTML = h;
  $('#wq').oninput = e => { mw.q = e.target.value; const p = e.target.selectionStart; renderWords(); const n = $('#wq'); n.focus(); n.setSelectionRange(p, p); };
  $('#wl').onchange = e => { mw.level = e.target.value; renderWords(); };
  $('#wk').onchange = e => { mw.kind = e.target.value; renderWords(); };
}
$('#wordsIn').addEventListener('click', async e => {
  const f = e.target.closest('[data-wf]'); if (f){ mw.f = f.dataset.wf; return renderWords(); }
  const so = e.target.closest('[data-sort]'); if (so){ if (mw.sort === so.dataset.sort) mw.dir = -mw.dir; else { mw.sort = so.dataset.sort; mw.dir = so.dataset.sort === 'word' ? 1 : -1; } return renderWords(); }
  const act = e.target.closest('[data-act]'), card = e.target.closest('.card');
  if (act && card){
    await api('/api/item', {session:cur, id:+card.dataset.id, action:act.dataset.act}).catch(x => alert(x.message));
    mw.items = (await api('/api/mywords')).items; lastPaneKey = ''; return renderWords();
  }
  if (card) return;
  const r = e.target.closest('tr.r'); if (r){ const id = +r.dataset.id; mw.open.has(id) ? mw.open.delete(id) : mw.open.add(id); renderWords(); }
});

$('#newBtn').onclick = openDlg;

/* ---------- voice: the browser's own speech engines, no keys ---------- */
function saveVoice(){ try{ localStorage.setItem('dilai_voice', JSON.stringify({speak:V.speak, voice:V.voice, rate:V.rate, pause:V.pause})); }catch(e){} }
function voices(){ return TTS ? speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)) : []; }
function pickVoice(){
  const vs = voices(); if (!vs.length) return null;
  const chosen = vs.find(v => v.name === V.voice); if (chosen) return chosen;
  const want = S && S.settings.variant === 'uk' ? 'en-GB' : 'en-US';
  const loc = vs.filter(v => v.lang.replace('_', '-') === want);
  const good = l => l.find(v => /premium|enhanced|natural|siri|google/i.test(v.name)) || l.find(v => /samantha|daniel|ava|alex|karen/i.test(v.name));
  return good(loc) || loc[0] || good(vs) || vs[0];
}
function sayText(text){
  if (!TTS) return;
  // one utterance per sentence: long utterances stall in Chrome
  for (const part of text.replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]+["”’')\]]*\s*|[^.!?…]+$/g) || []){
    if (!/[A-Za-z0-9]/.test(part)) continue;
    const u = new SpeechSynthesisUtterance(part.trim()), v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.rate = V.rate;
    speechSynthesis.speak(u);
  }
}
function voiceFeed(){
  // reads a reply aloud sentence by sentence while it is still being written
  const ses = S && S.session; if (!ses || !TTS || !(V.speak || V.talk)){ V.key = null; return; }
  const n = ses.messages.length;
  if (ses.busy){ const k = ses.id + ':' + n; if (V.key !== k){ V.key = k; V.off = 0; } }
  if (!V.key) return;
  let text, done = false;
  if (ses.busy){ text = ses.partial || ''; }
  else {
    const last = ses.messages[n - 1];
    if (!last || last.role !== 'assistant' || V.key !== ses.id + ':' + (n - 1)){ V.key = null; return; }
    text = last.text; done = true;
  }
  let rest = text.slice(V.off);
  if (!done){ const m = rest.match(/^[\s\S]*[.!?…]["”’')]*\s/); rest = m ? m[0] : ''; }
  if (rest){ V.off += rest.length; sayText(rest); }
  if (done) V.key = null;
}
function listen(on){
  V.want = on;
  if (!on){ if (V.rec) try{ V.rec.stop(); }catch(e){} return drawVoice(); }
  if (!SR || V.rec) return drawVoice();
  const r = new SR();
  r.lang = S && S.settings.variant === 'uk' ? 'en-GB' : 'en-US';
  r.continuous = true; r.interimResults = true;
  const box = $('#input');
  V.base = box.value.trim() ? box.value.trimEnd() + ' ' : ''; V.fin = ''; V.last = Date.now();
  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){ const t = e.results[i][0].transcript; if (e.results[i].isFinal) V.fin += t.trim() + ' '; else interim += t; }
    box.value = (V.base + V.fin + interim).replace(/\s+/g, ' '); autosize(); box.scrollTop = box.scrollHeight;
    V.spoken = true; V.last = Date.now();
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ V.want = false; V.talk = false; V.msg = 'The microphone is blocked. Allow it for this page in the browser’s address bar, then try again.'; }
    else if (e.error === 'network'){ V.want = false; V.talk = false; V.msg = 'Speech recognition could not reach its service. Check the connection, or try Safari.'; }
  };
  r.onend = () => { V.rec = null; if (V.want) listen(true); else drawVoice(); };
  try{ r.start(); V.rec = r; V.msg = ''; }catch(e){ V.msg = 'Could not start the microphone: ' + e.message; V.want = false; }
  drawVoice();
}
function drawVoice(){
  const mic = $('#micBtn'), talk = $('#talkBtn');
  mic.style.display = talk.style.display = SR ? '' : 'none';
  mic.classList.toggle('live', !!V.rec); mic.textContent = V.rec ? 'Stop' : 'Speak';
  talk.classList.toggle('on', V.talk); talk.textContent = V.talk ? 'End talk mode' : 'Talk mode';
  const speaking = TTS && (speechSynthesis.speaking || speechSynthesis.pending);
  let t = V.msg || '';
  if (!t && V.rec) t = V.talk ? 'Listening… your message is sent when you pause for ' + V.pause.toFixed(1) + ' s.' : 'Listening… click Stop when you are done, fix anything it misheard, then Send.';
  else if (!t && V.talk) t = speaking ? 'Speaking… start talking or click Speak to interrupt.' : (S && S.session && S.session.busy ? 'Thinking…' : '');
  $('#vstat').textContent = t;
}
$('#micBtn').onclick = () => { if (TTS) speechSynthesis.cancel(); V.msg = ''; listen(!V.rec); };
$('#talkBtn').onclick = () => {
  V.talk = !V.talk; V.msg = '';
  if (V.talk){ if (TTS){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } listen(true); }
  else { listen(false); if (TTS && !V.speak) speechSynthesis.cancel(); }
  drawVoice();
};
setInterval(() => {
  if (!S || !S.session) return;
  const speaking = TTS && (speechSynthesis.speaking || speechSynthesis.pending), busy = S.session.busy;
  if (V.talk){
    if (V.rec && V.spoken && $('#input').value.trim() && Date.now() - V.last > V.pause * 1000) send();
    else if (!V.rec && !V.want && !busy && !speaking && !V.key && !document.body.classList.contains('words') && S.session.source !== 'desktop') listen(true);
  }
  drawVoice();
}, 300);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-saytext]'); if (b){ speechSynthesis.cancel(); sayText(b.dataset.saytext); }
  if (e.target.id === 'voiceTest'){ speechSynthesis.cancel(); sayText('This is how I sound. Shall we start?'); }
});
if (TTS) speechSynthesis.onvoiceschanged = () => { if (tab === 'settings'){ lastPaneKey = ''; renderPane(); } };

function render(){ renderSessions(); renderTabs(); renderChat(); renderPane(); voiceFeed(); }
refresh();
</script>
